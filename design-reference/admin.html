ead><tbody>${state.coupons.map(c=>`<tr><td><b>${esc(c.code)}</b></td><td>${c.discount}%</td><td><span class="status">${c.active?'সক্রিয়':'বন্ধ'}</span></td><td><button class="btn secondary small" onclick="removeCoupon('${esc(c.code)}')">ডিলিট</button></td></tr>`).join('')}</tbody></table></div>`}function settings(){return head('স্টোর সেটিংস','Best Choice Online Shopping-এর সাধারণ তথ্য।')+`<div class="panel" style="max-width:680px"><form id="settingsForm" class="formgrid"><label class="full">স্টোরের নাম<input class="field" name="store" required value="${esc(state.settings.store)}"></label><label>যোগাযোগ নম্বর<input class="field" name="phone" required value="${esc(state.settings.phone)}"></label><label>ডেলিভারি চার্জ (৳)<input class="field" type="number" min="0" name="delivery" required value="${state.settings.delivery}"></label><div class="full"><button class="btn"><i class="fa-solid fa-floppy-disk"></i> সেটিংস সেভ করুন</button></div></form></div>`}function render(){document.getElementById('pendingCount').textContent=state.orders.filter(o=>o.status==='pending').length;document.getElementById('content').innerHTML=({dashboard,products,inventory,orders:ordersPage,categories:categoriesPage,customers,coupons,settings}[page])();if(page==='inventory'){document.getElementById('inventorySearch').oninput=e=>{search=e.target.value;refreshPreserve('inventorySearch')};document.getElementById('inventoryFilter').onchange=e=>{filter=e.target.value;render()};document.getElementById('lowLimit').onchange=e=>{state.lowStockLimit=Math.max(0,Math.floor(Number(e.target.value)||0));save();render()}}if(page==='products'){document.getElementById('productSearch').oninput=e=>{search=e.target.value;refreshPreserve('productSearch')};document.getElementById('productFilter').onchange=e=>{filter=e.target.value;render()}}if(page==='orders'){document.getElementById('orderSearch').oninput=e=>{search=e.target.value;refreshPreserve('orderSearch')};document.getElementById('orderFilter').onchange=e=>{filter=e.target.value;render()}}if(page==='settings'){document.getElementById('settingsForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.settings={store:f.get('store'),phone:f.get('phone'),delivery:Number(f.get('delivery'))};save();toast('সেটিংস সেভ হয়েছে (ডেমো)')}}}function refreshPreserve(id){const el=document.getElementById(id),pos=el.selectionStart;render();const next=document.getElementById(id);next.focus();next.setSelectionRange(pos,pos)}function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modalback').classList.add('open')}function closeModal(){document.getElementById('modalback').classList.remove('open')}document.getElementById('modalback').onclick=e=>{if(e.target.id==='modalback')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});function editProduct(id){const p=state.products.find(x=>x.id===id)||{name:'',category:categories[0],price:'',stock:'',img:''};openModal(id?'প্রোডাক্ট এডিট':'নতুন প্রোডাক্ট',`<form id="productForm" class="formgrid"><label class="full">প্রোডাক্টের নাম<input class="field" name="name" required value="${esc(p.name)}"></label><label>ক্যাটেগরি<select class="field" name="category">${categories.map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label>মূল্য (৳)<input class="field" type="number" min="0" name="price" required value="${p.price}"></label><label>স্টক<input class="field" type="number" min="0" name="stock" required value="${p.stock}"></label><label class="full">ইমেজ URL<input class="field" name="img" placeholder="https://..." value="${esc(p.img)}"></label><div class="full"><button class="btn"><i class="fa-solid fa-check"></i> সেভ করুন</button></div></form>`);document.getElementById('productForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const old=state.products.find(x=>x.id===id);const data={id:id||Date.now(),name:f.get('name'),category:f.get('category'),price:Number(f.get('price')),stock:Number(f.get('stock')),img:f.get('img')||'https://placehold.co/500x400/f1f5f1/164c39?text=Best+Choice'};if(old&&old.stock!==data.stock)state.movements.unshift({date:new Date().toLocaleString('bn-BD'),name:data.name,delta:data.stock-old.stock,before:old.stock,after:data.stock,note:'প্রোডাক্ট এডিট থেকে পরিবর্তন'});if(id)state.products=state.products.map(x=>x.id===id?data:x);else state.products.unshift(data);save();closeModal();render();toast('প্রোডাক্ট সেভ হয়েছে')}}function deleteProduct(id){if(!confirm('এই প্রোডাক্টটি মুছে ফেলবেন?'))return;state.products=state.products.filter(p=>p.id!==id);save();render();toast('প্রোডাক্ট ডিলিট হয়েছে')}function editOrder(id){const o=state.orders.find(x=>x.id===id);openModal('অর্ডার '+id,`<div style="margin-bottom:17px"><b>${esc(o.name)}</b><div class="sub">${esc(o.phone)} · ${money(o.total)}</div></div><form id="orderForm" class="formgrid"><label class="full">অর্ডার স্ট্যাটাস<select class="field" name="status">${['pending','processing','delivered','cancelled'].map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${statusLabel(s)}</option>`).join('')}</select></label><div class="full"><button class="btn">স্ট্যাটাস আপডেট</button></div></form>`);document.getElementById('orderForm').onsubmit=e=>{e.preventDefault();o.status=new FormData(e.target).get('status');save();closeModal();render();toast('অর্ডার আপডেট হয়েছে')}}function editCoupon(){openModal('নতুন কুপন',`<form id="couponForm" class="formgrid"><label>কুপন কোড<input class="field" name="code" required placeholder="SALE10"></label><label>ডিসকাউন্ট (%)<input class="field" name="discount" type="number" min="1" max="100" required></label><div class="full"><button class="btn">কুপন সেভ করুন</button></div></form>`);document.getElementById('couponForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),code=String(f.get('code')).trim().toUpperCase();if(state.coupons.some(c=>c.code===code)){toast('এই কোডটি ইতিমধ্যে আছে');return}state.coupons.push({code,discount:Number(f.get('discount')),active:true});save();closeModal();render();toast('কুপন সেভ হয়েছে')}}function removeCoupon(code){if(!confirm('কুপন মুছে ফেলবেন?'))return;state.coupons=state.coupons.filter(c=>c.code!==code);save();render()}render();
</script></body></html>
